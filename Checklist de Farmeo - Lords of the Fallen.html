<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist de Farmeo - Lords of the Fallen</title>
<style>
  :root {
    --bg: #12100e;
    --card: #1d1a17;
    --border: #3a332b;
    --text: #ece6da;
    --muted: #a89f8f;
    --accent: #c9a24b;
    --accent-dim: #8a723a;
    --done: #6b8f6b;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4efe4;
      --card: #ffffff;
      --border: #ddd3bd;
      --text: #2a2419;
      --muted: #74695a;
      --accent: #a37b1f;
      --accent-dim: #cbb27a;
      --done: #4e7a4e;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4efe4;
    --card: #ffffff;
    --border: #ddd3bd;
    --text: #2a2419;
    --muted: #74695a;
    --accent: #a37b1f;
    --accent-dim: #cbb27a;
    --done: #4e7a4e;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
    padding-left: 16px;
    padding-right: 16px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 {
    font-size: 1.6rem;
    text-align: center;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    color: var(--accent);
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 18px;
  }
  .progress-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
  }
  .progress-bar-bg {
    flex: 1;
    height: 10px;
    background: var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
    min-width: 58px;
    text-align: right;
  }
  .zone {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .zone-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
  }
  .zone-title {
    font-weight: bold;
    color: var(--accent);
    font-size: 1.05rem;
  }
  .zone-count {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .zone-items {
    border-top: 1px solid var(--border);
    padding: 6px 16px 10px 16px;
  }
  .zone-items.collapsed { display: none; }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px dashed var(--border);
  }
  .item:last-child { border-bottom: none; }
  .item input[type="checkbox"] {
    margin-top: 3px;
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .item label {
    flex: 1;
    line-height: 1.35;
    cursor: pointer;
  }
  .item.checked label {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--done);
  }
  .slot {
    font-size: 0.78rem;
    color: var(--muted);
    display: block;
  }
  .enemy-group { margin-top: 10px; }
  .enemy-title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.82rem;
    font-weight: bold;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--accent);
    border-bottom: 1px solid var(--accent-dim);
    padding: 4px 0 3px 0;
  }
  .enemy-title.complete { color: var(--done); border-bottom-color: var(--done); }
  .enemy-count { font-size: 0.75rem; color: var(--muted); font-weight: normal; }
  .reset-btn {
    display: block;
    margin: 24px auto 0 auto;
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--muted);
    padding: 8px 18px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reset-btn:active { opacity: 0.7; }
  .storage-status {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin: -10px 0 16px 0;
  }
  .storage-status.warn { color: #c0553a; }
  .tools {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 24px;
  }
  .tools .reset-btn { margin: 0; }
  .reset-btn.danger { border-color: #c0553a; color: #c0553a; }
  .backup-panel {
    display: none;
    margin-top: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .backup-panel.open { display: block; }
  .backup-panel p { margin: 0 0 8px 0; font-size: 0.82rem; color: var(--muted); }
  .backup-panel textarea {
    width: 100%;
    min-height: 90px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-family: monospace;
    font-size: 0.75rem;
    resize: vertical;
  }
  .backup-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .backup-msg { font-size: 0.8rem; color: var(--done); margin-top: 6px; min-height: 1em; }
  .enemy-img {
    width: 300px;
    max-width: 100%;
    aspect-ratio: 3 / 2;
    margin: 8px auto 4px auto;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .enemy-img img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .enemy-note {
    margin: 6px 0 2px 0;
    padding-left: 8px;
    border-left: 2px solid var(--accent-dim);
    font-size: 0.8rem;
    font-style: italic;
    color: var(--muted);
  }
  .chevron {
    transition: transform 0.2s ease;
    color: var(--muted);
  }
  .zone-header.open .chevron { transform: rotate(90deg); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Farmeo — Lords of the Fallen</h1>
  <div class="subtitle">Checklist agrupado por zona</div>

  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
  </div>

  <div class="storage-status" id="storageStatus"></div>

  <div id="zonesContainer"></div>

  <div class="tools">
    <button class="reset-btn" id="backupBtn">Respaldo</button>
    <button class="reset-btn" id="resetBtn">Reiniciar checklist</button>
  </div>

  <div class="backup-panel" id="backupPanel">
    <p>Copiá este texto y guardalo donde quieras. Para restaurar en otro navegador o dispositivo, pegalo acá y tocá "Restaurar".</p>
    <textarea id="backupText" spellcheck="false"></textarea>
    <div class="backup-actions">
      <button class="reset-btn" id="copyBackup">Copiar</button>
      <button class="reset-btn" id="restoreBackup">Restaurar</button>
    </div>
    <div class="backup-msg" id="backupMsg"></div>
  </div>
</div>

const OLD_STORAGE_KEY = "lotf-farmeo-checklist-v1";
const STORAGE_KEY = "lotf-farmeo-checklist-v2";
const COLLAPSE_KEY = "lotf-farmeo-collapse-v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    // Migración desde la versión anterior (claves por posición) a claves por nombre
    const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
    const migrated = {};
    if (oldRaw) {
      const oldState = JSON.parse(oldRaw);
      Object.keys(oldState).forEach(k => {
        if (oldState[k] && OLD_KEYS[k]) migrated[OLD_KEYS[k]] = true;
      });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated)); } catch (e) {}
    }
    return migrated;
  } catch (e) {
    return {};
  }
}
let storageOk = true;
function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    storageOk = true;
  } catch (e) {
    storageOk = false;
  }
  updateStorageStatus();
}
function testStorage() {
  try {
    localStorage.setItem("lotf-test", "1");
    localStorage.removeItem("lotf-test");
    return true;
  } catch (e) {
    return false;
  }
}
function updateStorageStatus() {
  const el = document.getElementById("storageStatus");
  if (!el) return;
  if (storageOk) {
    el.textContent = "Tus tildes se guardan automáticamente en este navegador";
    el.className = "storage-status";
  } else {
    el.textContent = "Este navegador no permite guardar: usá \"Respaldo\" para no perder tus tildes";
    el.className = "storage-status warn";
  }
}
function loadCollapse() {
  try {
    const raw = localStorage.getItem(COLLAPSE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveCollapse(state) {
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(state)); } catch (e) {}
}

let checkState = loadState();
let collapseState = loadCollapse();

function esc(t) {
  return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function render() {
  const container = document.getElementById("zonesContainer");
  container.innerHTML = "";
  let total = 0;
  let done = 0;

  DATA.forEach((zoneData, zi) => {
    const zoneItems = zoneData.enemies.flatMap(e => e.items);
    const zoneDone = zoneItems.filter(it => checkState[it.name]).length;
    total += zoneItems.length;
    done += zoneDone;

    const zoneEl = document.createElement("div");
    zoneEl.className = "zone";

    const isCollapsed = !!collapseState[zi];

    const header = document.createElement("div");
    header.className = "zone-header" + (isCollapsed ? "" : " open");
    header.innerHTML = `
      <span class="zone-title">${esc(zoneData.zone)}</span>
      <span style="display:flex; align-items:center; gap:8px;">
        <span class="zone-count">${zoneDone}/${zoneItems.length}</span>
        <span class="chevron">▶</span>
      </span>
    `;

    const itemsEl = document.createElement("div");
    itemsEl.className = "zone-items" + (isCollapsed ? " collapsed" : "");

    zoneData.enemies.forEach((enemyData, ei) => {
      const enemyDone = enemyData.items.filter(it => checkState[it.name]).length;
      const group = document.createElement("div");
      group.className = "enemy-group";

      const title = document.createElement("div");
      title.className = "enemy-title" + (enemyDone === enemyData.items.length ? " complete" : "");
      title.innerHTML = `<span>${esc(enemyData.enemy)}</span><span class="enemy-count">${enemyDone}/${enemyData.items.length}</span>`;
      group.appendChild(title);

      const imgData = ENEMY_IMAGES[enemyData.enemy];
      if (imgData) {
        if (!imgFrames[enemyData.enemy]) {
          const frame = document.createElement("div");
          frame.className = "enemy-img";
          frame.style.background = imgData.bg;
          const im = document.createElement("img");
          im.src = imgData.src;
          im.alt = enemyData.enemy;
          im.decoding = "async";
          frame.appendChild(im);
          imgFrames[enemyData.enemy] = frame;
        }
        group.appendChild(imgFrames[enemyData.enemy]);
      }

      if (enemyData.note) {
        const noteEl = document.createElement("div");
        noteEl.className = "enemy-note";
        noteEl.textContent = enemyData.note;
        group.appendChild(noteEl);
      }

      enemyData.items.forEach((item, ii) => {
        const checked = !!checkState[item.name];
        const row = document.createElement("div");
        row.className = "item" + (checked ? " checked" : "");
        const cbId = "cb-" + zi + "-" + ei + "-" + ii;
        row.innerHTML = `
          <input type="checkbox" id="${cbId}" ${checked ? "checked" : ""}>
          <label for="${cbId}">${esc(item.name)}<span class="slot">${esc(item.slot)}</span></label>
        `;
        row.querySelector("input").addEventListener("change", (ev) => {
          if (ev.target.checked) checkState[item.name] = true;
          else delete checkState[item.name];
          saveState(checkState);
          render();
        });
        group.appendChild(row);
      });

      itemsEl.appendChild(group);
    });

    header.addEventListener("click", () => {
      collapseState[zi] = !collapseState[zi];
      saveCollapse(collapseState);
      render();
    });

    zoneEl.appendChild(header);
    zoneEl.appendChild(itemsEl);
    container.appendChild(zoneEl);
  });

  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = done + " / " + total;
}

// Reiniciar con confirmación en línea (los diálogos del navegador pueden estar bloqueados)
let resetTimer = null;
const resetBtn = document.getElementById("resetBtn");
resetBtn.addEventListener("click", () => {
  if (resetBtn.classList.contains("danger")) {
    clearTimeout(resetTimer);
    resetBtn.classList.remove("danger");
    resetBtn.textContent = "Reiniciar checklist";
    checkState = {};
    saveState(checkState);
    render();
  } else {
    resetBtn.classList.add("danger");
    resetBtn.textContent = "¿Seguro? Tocá de nuevo";
    resetTimer = setTimeout(() => {
      resetBtn.classList.remove("danger");
      resetBtn.textContent = "Reiniciar checklist";
    }, 4000);
  }
});

// Respaldo manual (texto) por si el navegador borra los datos del sitio
const allNames = new Set(DATA.flatMap(z => z.enemies.flatMap(e => e.items.map(i => i.name))));
const backupPanel = document.getElementById("backupPanel");
const backupText = document.getElementById("backupText");
const backupMsg = document.getElementById("backupMsg");

function buildBackup() {
  return JSON.stringify({ v: 2, checks: Object.keys(checkState).filter(k => checkState[k] && allNames.has(k)) });
}
document.getElementById("backupBtn").addEventListener("click", () => {
  backupPanel.classList.toggle("open");
  backupText.value = buildBackup();
  backupMsg.textContent = "";
});
document.getElementById("copyBackup").addEventListener("click", async () => {
  backupText.value = buildBackup();
  try {
    await navigator.clipboard.writeText(backupText.value);
    backupMsg.textContent = "Copiado.";
  } catch (e) {
    backupText.focus();
    backupText.select();
    backupMsg.textContent = "Texto seleccionado: copialo manualmente.";
  }
});
document.getElementById("restoreBackup").addEventListener("click", () => {
  try {
    const data = JSON.parse(backupText.value.trim());
    if (!data || !Array.isArray(data.checks)) throw new Error("formato");
    const restored = {};
    data.checks.forEach(n => { if (allNames.has(n)) restored[n] = true; });
    checkState = restored;
    saveState(checkState);
    render();
    backupMsg.textContent = "Restaurado: " + Object.keys(restored).length + " ítems tildados.";
  } catch (e) {
    backupMsg.textContent = "El texto no es un respaldo válido.";
  }
});

// Sincronizar si se abre la página en otra pestaña
window.addEventListener("storage", (ev) => {
  if (ev.key === STORAGE_KEY) {
    checkState = loadState();
    render();
  }
});

// Pedir almacenamiento persistente para que el navegador no lo borre por falta de espacio
try {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
} catch (e) {}

storageOk = testStorage();
if (storageOk) saveState(checkState); // asegura que la migración quede guardada
updateStorageStatus();
render();
</script>
